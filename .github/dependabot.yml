version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: "chore(deps): [medium] "
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
  - package-ecosystem: gomod
    directory: "/"
    commit-message:
      prefix: "chore(deps): [high] "
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
