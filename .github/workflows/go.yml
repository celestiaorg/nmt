name: Go

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:

  # build runs on the Go version in go.mod, the lowest that importers may use.
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
        id: go

      - name: Get dependencies
        run: |
          go get -v -t -d ./...

      - name: Build
        run: go build -v .

      - name: Test
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          go test -v ./...

  # test-latest-go runs the tests on the newest supported Go release and
  # uploads coverage. Coverage comes from this job only: Go releases split code
  # into coverage blocks differently, so mixing them moves the percentage. See
  # "Go version" in README.md.
  test-latest-go:
    name: Test (latest Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Test
        run: go test -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.txt
          use_oidc: true
